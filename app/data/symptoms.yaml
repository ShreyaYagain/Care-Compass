    related_specialties: ["nursing"]
  lab_test:
    synonyms: ["blood test", "sample collection", "sugar check", "lipid profile", "lab test"]
    related_specialties: ["pathology"]
  teleconsultation_query:
    synonyms: ["consultation", "second opinion", "prescription", "medicine advice"]
    related_specialties: ["general_medicine"]
