# CareCompass closed follow-up question bank.
#
# This file is the ONLY source of follow-up questions. No free-form question text
# (from the LLM or otherwise) may reach the user. `core/intake.py` selects an `id`
# from this bank and localises it into the user's language.
#
# Allowed ids are a closed set. Nothing about choosing a service, a treatment,
# scheduling/time of treatment, medicines, or "what the doctor should do" is
# permitted here. Severity questions are forbidden.
#
# Schema per entry:
#   id            : stable bank id (closed set below)
#   slot          : the intake slot this question fills
#   purpose       : red_flag_screen | who_for | main_symptom | duration
#   text_en       : English wording
#   text_hi       : Hindi (Devanagari) wording
#   text_hinglish : Hinglish (Roman Hindi-English) wording
#   options       : list of {en, hi, hinglish} option labels

question_bank:
  - id: breathing_difficulty
    slot: breathing_difficulty
    purpose: red_flag_screen
    text_en: "Is the patient experiencing any difficulty in breathing?"
    text_hi: "क्या सांस लेने में कोई तकलीफ या सांस फूलने की समस्या है?"
    text_hinglish: "Kya saans lene mein koi dikkat ya takleef ho rahi hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: chest_pain_check
    slot: chest_pain
    purpose: red_flag_screen
    text_en: "Is the patient experiencing acute chest pain or heavy pressure?"
    text_hi: "क्या सीने में तेज दर्द या भारी दबाव महसूस हो रहा है?"
    text_hinglish: "Kya seene mein tez dard ya dabav mehsoos ho raha hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: consciousness_check
    slot: consciousness
    purpose: red_flag_screen
    text_en: "Is the person fully conscious, alert, and responding properly?"
    text_hi: "क्या मरीज पूरी तरह होश में है और ठीक से बातचीत कर पा रहा है?"
    text_hinglish: "Kya patient poori tarah hosh mein hai aur normal respond kar raha hai?"
    options:
      - { en: "Yes, fully alert", hi: "हाँ, पूरी तरह होश में", hinglish: "Yes, fully alert" }
      - { en: "Drowsy / faint", hi: "सुस्त / बेहोश जैसा", hinglish: "Drowsy / faint" }
      - { en: "Unconscious", hi: "बेहोश", hinglish: "Unconscious" }

  - id: bleeding_check
    slot: bleeding
    purpose: red_flag_screen
    text_en: "Is there any active or heavy bleeding?"
    text_hi: "क्या कहीं से तेज या लगातार खून बह रहा है?"
    text_hinglish: "Kya kahin se tez ya lagatar bleeding (khoon) ho rahi hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Minor only", hi: "हल्का सा", hinglish: "Minor only" }

  - id: who_for_age_group
    slot: who_for
    purpose: who_for
    text_en: "Who is this consultation for?"
    text_hi: "यह परामर्श किसके लिए है?"
    text_hinglish: "Yeh consultation kiske liye hai?"
    options:
      - { en: "Self", hi: "स्वयं", hinglish: "Self" }
      - { en: "Child (<5)", hi: "छोटा बच्चा (<5)", hinglish: "Child (<5)" }
      - { en: "Elderly (60+)", hi: "बुजुर्ग व्यक्ति (60+)", hinglish: "Elderly (60+)" }
      - { en: "Other adult", hi: "अन्य वयस्क", hinglish: "Other adult" }

  - id: main_symptom_buttons
    slot: main_symptom
    purpose: main_symptom
    text_en: "No symptoms were recognised. Please try again."
    text_hi: "कोई लक्षण पहचाने नहीं गए। कृपया दोबारा बताएं।"
    text_hinglish: "Koi symptoms pehchane nahi gaye. Kripya dobara boliye ya type karein."
    options:
      - { en: "Fever or cough", hi: "बुखार या खांसी", hinglish: "Bukhar ya khansi" }
      - { en: "Pain or injury", hi: "दर्द या चोट", hinglish: "Dard ya chot" }
      - { en: "Weak or elderly person", hi: "कमज़ोर या बुज़ुर्ग व्यक्ति", hinglish: "Kamzor ya buzurg person" }
      - { en: "Wound / injection / dressing", hi: "घाव / इंजेक्शन / पट्टी", hinglish: "Ghaav / injection / dressing" }
      - { en: "Lab test", hi: "खून या लैब टेस्ट", hinglish: "Lab test" }
      - { en: "Something else", hi: "कुछ और", hinglish: "Kuch aur" }

  - id: duration_days
    slot: duration
    purpose: duration
    text_en: "How long has this issue been going on?"
    text_hi: "यह समस्या कब से हो रही है?"
    text_hinglish: "Yeh pareshani kab se ho rahi hai?"
    options:
      - { en: "Today", hi: "आज से", hinglish: "Today" }
      - { en: "2-3 days", hi: "2-3 दिन", hinglish: "2-3 days" }
      - { en: "More than a week", hi: "एक हफ्ते से अधिक", hinglish: "More than a week" }

  - id: infant_fever_age_check
    slot: high_fever_infant
    purpose: red_flag_screen
    text_en: "Is the baby under 3 months old and running a fever?"
    text_hi: "क्या बच्चा 3 महीने से छोटा है और उसे बुखार है?"
    text_hinglish: "Kya baby 3 mahine se chhota hai aur bukhar hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: dehydration_check
    slot: severe_dehydration
    purpose: red_flag_screen
    text_en: "Has the patient stopped passing urine, or have sunken eyes / cannot keep water down?"
    text_hi: "क्या मरीज का पेशाब बंद हो गया है, आंखें धंस गई हैं, या पानी नहीं रुक रहा?"
    text_hinglish: "Kya patient ka peshab band hai, aankhen dhas gayi, ya paani nahi ruk raha?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: stroke_check
    slot: stroke_symptoms
    purpose: red_flag_screen
    text_en: "Is one side of the face or body weak, drooping, or not working right now?"
    text_hi: "क्या चेहरे या शरीर का एक तरफ अभी कमजोर, टेढ़ा या काम नहीं कर रहा है?"
    text_hinglish: "Kya face ya body ka ek side abhi kamzor, tedha ya kaam nahi kar raha hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: seizure_check
    slot: seizure
    purpose: red_flag_screen
    text_en: "Is the person having a fit, jerking, or shaking uncontrollably right now?"
    text_hi: "क्या मरीज़ को अभी दौरा पड़ रहा है या शरीर अनियंत्रित झटक रहा है?"
    text_hinglish: "Kya patient ko abhi daura pad raha hai ya body jhatak rahi hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: suicidal_check
    slot: suicidal_ideation
    purpose: red_flag_screen
    text_en: "Is the person saying they want to hurt themselves or end their life right now?"
    text_hi: "क्या व्यक्ति अभी खुद को नुकसान पहुंचाने या जान देने की बात कर रहा है?"
    text_hinglish: "Kya person abhi khud ko nuksan pahunchane ya jaan dene ki baat kar raha hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: combined_red_flag_screen
    slot: any_red_flag
    purpose: red_flag_screen
    text_en: "Is there trouble breathing, chest pain, heavy bleeding, fits, fainting, or can't wake up?"
    text_hi: "क्या सांस लेने में दिक्कत, सीने में दर्द, ज़्यादा खून बहना, दौरे, बेहोशी, या जगाने पर न उठना जैसा कुछ हो रहा है?"
    text_hinglish: "Kya saans lene mein dikkat, seene mein dard, zyada khoon behna, daure, behoshi, ya jagaane par na uthna jaisa kuch ho raha hai?"
    options:
      - { en: "Yes", hi: "हाँ", hinglish: "Yes" }
      - { en: "No", hi: "नहीं", hinglish: "No" }
      - { en: "Not sure", hi: "पक्का नहीं", hinglish: "Not sure" }

  - id: which_red_flag_symptom
    slot: any_red_flag
    purpose: red_flag_screen
    text_en: "Which one is happening right now?"
    text_hi: "अभी इनमें से क्या हो रहा है?"
    text_hinglish: "Abhi inme se kya ho raha hai?"
    options:
      - { en: "Trouble breathing", hi: "सांस लेने में दिक्कत", hinglish: "Saans lene mein dikkat" }
      - { en: "Chest pain or pressure", hi: "सीने में दर्द या दबाव", hinglish: "Seene mein dard ya dabav" }
      - { en: "Heavy bleeding", hi: "ज़्यादा खून बहना", hinglish: "Zyada khoon behna" }
      - { en: "Fits or shaking", hi: "दौरे या झटके", hinglish: "Daure ya jhatke" }
      - { en: "Fainted or can't wake up", hi: "बेहोशी या न उठना", hinglish: "Behoshi ya na uthna" }

# --- Symptom synonym list (used by the rule-based intake extractor) ---
# This is the single canonical symptom lexicon: the extractor and the
# explanation builder may only ever emit names from this list.
symptoms_list:
  fever:
    synonyms: ["bukhar", "bukhaar", "fever", "taap", "temperature", "garam sharir"]
    related_specialties: ["general_medicine", "paediatrics"]
  cough:
    synonyms: ["khansi", "khasi", "cough", "coughing", "khokhi"]
    related_specialties: ["pulmonology", "general_medicine"]
  chest_pain:
