prompt_injection_patterns:
  - "(?i)ignore\\s+(?:all\\s+)?previous\\s+instructions"
  - "(?i)disregard\\s+(?:earlier|prior|previous)\\s+(?:instructions|rules)"
  - "(?i)forget\\s+(?:all\\s+)?(?:your\\s+)?instructions"
  - "(?i)\\bact\\s+as\\b"
  - "(?i)\\bpretend\\s+(?:you\\s+are|to\\s+be)\\b"
  - "(?i)\\byou\\s+are\\s+now\\b"
  - "(?i)reveal\\s+(?:your\\s+)?(?:system\\s+)?prompt"
  - "(?i)show\\s+(?:me\\s+)?(?:your\\s+)?(?:system\\s+)?prompt"
  - "(?i)print\\s+(?:your\\s+)?(?:system\\s+)?prompt"
  - "(?i)what\\s+(?:are\\s+)?your\\s+(?:system\\s+)?instructions"
  - "(?i)developer\\s+mode"
  - "(?i)\\bjailbreak\\b"
  - "(?i)\\bdan\\s+mode\\b"
  - "(?i)bypass\\s+(?:safety|rules|filters)"
  # Hindi / Hinglish injections
  - "(?i)pichle\\s+(?:saare\\s+)?(?:instructions|rules|nirdesh)\\s+bhool\\s+jao"
  - "(?i)sab\\s+kuch\\s+bhool\\s+jao"
  - "(?i)apna\\s+(?:hidden\\s+)?prompt\\s+(?:dikhao|batao)"
  - "(?i)system\\s+prompt\\s+batao"
  - "(?i)apne\\s+rules\\s+batao"
  - "(?i)doctor\\s+ban\\s+jao"
  - "(?i)natak\\s+karo"
  - "(?i)jailbreak\\s+karo"
  - "(?i)पिछले\\s+(?:सभी\\s+)?निर्देश\\s+भूल\\s+जाओ"
  - "(?i)सिस्टम\\s+प्रॉम्प्ट\\s+(?:दिखाओ|बताओ)"
  - "(?i)डेवलपर\\s+मोड"
  - "(?i)जेलब्रेक"
  - "(?i)नियम\\s+बताओ"
  - "(?i)डॉक्टर\\s+बनकर\\s+दिखाओ"
  - "(?i)दवा\\s+का\\s+पर्चा"
  - "(?i)सुरक्षा\\s+नियम"

