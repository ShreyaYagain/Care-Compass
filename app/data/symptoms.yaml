    related_specialties: ["general_medicine", "gastroenterology"]
  injury:
    synonyms: ["chot", "wound", "accident", "fracture", "moch", "cut"]
    related_specialties: ["orthopaedics", "general_medicine"]
  vomiting:
    synonyms: ["ulti", "vomit", "dast", "loose motion"]
    related_specialties: ["general_medicine"]
  headache:
    synonyms: ["sir dard", "sar dard", "headache", "migraine"]
