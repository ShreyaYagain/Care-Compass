# Golden end-to-end scenarios — every message the team has reported plus
# representative coverage. Run by scripts/smoke.sh (LLM mocked, deterministic).
#
# Fields:
#   id, message, language
#   screen: "skip" or a list of red-flag ids to inject (mocks the semantic screen)
#   expect_care_type: exact care_type or null (null = don't care / undecided question)
#   expect_urgency:   exact urgency or null
#   expect_question:  true | false | null (null = don't care)
#   expect_red_flag:  a flag id that must be present, or null
#   forbid_emergency: true = care_type must NOT be emergency_112
